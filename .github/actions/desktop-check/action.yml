name: Validate desktop source
description: Install the pinned toolchains and run the desktop and release-script checks.
inputs:
  requested-ref:
    description: Tag explicitly selected by a release workflow.
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24.18.0'
        cache: npm
        cache-dependency-path: |
          packages/package-lock.json
          app/package-lock.json
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - name: Check versions and tag
      shell: bash
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        REQUESTED_REF: ${{ inputs.requested-ref }}
      run: |
        python -B scripts/release.py check
        if [[ "$REF_TYPE" == tag ]]; then
          python -B scripts/release.py check --version "${REF_NAME#v}"
        fi
        if [[ "$REQUESTED_REF" == refs/tags/v* ]]; then
          python -B scripts/release.py check --version "${REQUESTED_REF#refs/tags/v}"
        fi
        python -B -m unittest discover -s scripts/tests -v
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
          libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
    - name: Install Rust
      shell: bash
      run: |
        rustup toolchain install 1.99.1 --profile minimal
        rustup default 1.99.1
        rustc --version
    - name: Build and test packages
      shell: bash
      working-directory: packages
      run: |
        npm ci --ignore-scripts
        npm run build
        node --test --test-concurrency=1 tests/*.test.mjs
    - name: Build and test application
      shell: bash
      working-directory: app
      run: |
        npm ci --ignore-scripts
        npm run build
        node --experimental-strip-types --test --test-concurrency=1 tests/*.test.mjs
        cargo test --manifest-path src-tauri/Cargo.toml --locked
