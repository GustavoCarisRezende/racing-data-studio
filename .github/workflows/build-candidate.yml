name: Build desktop candidate

# Produces downloadable workflow artifacts only. It does NOT publish a release
# or modify the beta/stable update feeds.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      signed:
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            bundles: appimage
          - platform: windows-x64
            os: windows-2022
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    environment: ${{ inputs.signed && 'release-signing' || 'candidate-build' }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      NODE_OPTIONS: --max-old-space-size=1536
      APPIMAGE_EXTRACT_AND_RUN: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/desktop-check
        with:
          requested-ref: ${{ inputs.ref }}
      - name: Collect JavaScript license notices
        working-directory: packages
        run: npm run notices --silent > ../release-notices.txt
      - name: Build native packages
        if: ${{ !inputs.signed }}
        working-directory: app
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          npm run tauri build -- --bundles "$BUNDLES" \
            --config '{"bundle":{"active":true}}' -- --locked
      - name: Build signed native packages
        if: ${{ inputs.signed }}
        working-directory: app
        env:
          BUNDLES: ${{ matrix.bundles }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python -B ../scripts/prepare-updater.py --output src-tauri/tauri.release.generated.json
          npm run tauri build -- --bundles "$BUNDLES" \
            --config src-tauri/tauri.release.generated.json -- --locked
      - name: Collect candidate
        env:
          PLATFORM: ${{ matrix.platform }}
          SIGNED: ${{ inputs.signed }}
        run: |
          if [[ "$SIGNED" == true ]]; then
            python -B scripts/collect-candidate.py --platform "$PLATFORM" --signed
          else
            python -B scripts/collect-candidate.py --platform "$PLATFORM"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: racing-data-studio-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
