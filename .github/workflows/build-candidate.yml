name: Build desktop candidate

# Produces downloadable workflow artifacts only. It does NOT publish a release
# or modify the beta/stable update feeds.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      signed:
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            bundles: appimage
          - platform: windows-x64
            os: windows-2022
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    environment: ${{ inputs.signed && 'release-signing' || 'candidate-build' }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      NODE_OPTIONS: --max-old-space-size=1536
      APPIMAGE_EXTRACT_AND_RUN: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            packages/package-lock.json
            app/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check versions and tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          python -B scripts/release.py check
          if [[ "$REF_TYPE" == tag ]]; then
            python -B scripts/release.py check --version "${REF_NAME#v}"
          fi
          if [[ "$REQUESTED_REF" == refs/tags/v* ]]; then
            python -B scripts/release.py check --version "${REQUESTED_REF#refs/tags/v}"
          fi
          python -B -m unittest discover -s scripts/tests -p test_release.py -v
          python -B -m unittest discover -s scripts/tests -p test_update_feed.py -v
          python -B -m unittest discover -s scripts/tests -p test_signing_config.py -v
          python -B -m unittest discover -s scripts/tests -p test_assemble_release.py -v
      - name: Test Linux-only cleanup tool with isolated fixtures
        if: runner.os == 'Linux'
        run: python -B -m unittest discover -s scripts/tests -p test_reset_local_data.py -v
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustc --version
      - name: Build and test packages
        working-directory: packages
        run: |
          npm ci --ignore-scripts
          npm run build
          node --test --test-concurrency=1 tests/*.test.mjs
          npm run notices --silent > ../release-notices.txt
      - name: Install and test application
        working-directory: app
        run: |
          npm ci --ignore-scripts
          node --experimental-strip-types --test --test-concurrency=1 tests/*.test.mjs
          cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build native packages
        if: ${{ !inputs.signed }}
        working-directory: app
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          npm run tauri build -- --bundles "$BUNDLES" \
            --config '{"bundle":{"active":true}}' -- --locked
      - name: Build signed native packages
        if: ${{ inputs.signed }}
        working-directory: app
        env:
          BUNDLES: ${{ matrix.bundles }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python -B ../scripts/prepare-updater.py --output src-tauri/tauri.release.generated.json
          npm run tauri build -- --bundles "$BUNDLES" \
            --config src-tauri/tauri.release.generated.json -- --locked
      - name: Collect candidate
        env:
          PLATFORM: ${{ matrix.platform }}
          SIGNED: ${{ inputs.signed }}
        run: |
          if [[ "$SIGNED" == true ]]; then
            python -B scripts/collect-candidate.py --platform "$PLATFORM" --signed
          else
            python -B scripts/collect-candidate.py --platform "$PLATFORM"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: racing-data-studio-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
