[package]
name = "racing-data-studio"
version = "0.0.1-beta.1"
description = "Local-first motorsport data studio"
authors = ["Racing Data Studio contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-updater = "=2.14.1"
base64 = "=0.23.1"
rusqlite = { version = "=0.41.1", features = ["backup", "bundled"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
tempfile = "=3.27.0"
zip = { version = "=9.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
